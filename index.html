<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi Sitio</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>NOMBRE DEL SITIO</h1>
    </header>


    <!-- INICIO -->

    <main id="inicio">

        <img
            src="imagen.jpg"
            alt="Imagen principal"
            class="imagen-principal"
        >

        <button
            class="boton-principal"
            onclick="mostrarRegistro()">
            BOTÓN PRINCIPAL
        </button>

        <p>
            ¿Eres voluntario? ¡Regístrate!
        </p>

        <button
            class="boton-registro"
            onclick="mostrarRegistro()">
            Registrarse
        </button>

    </main>


    <!-- REGISTRO -->

    <section id="registro" class="registro-oculto">

        <h2>Registrarse</h2>

        <form onsubmit="registrarUsuario(event)">

            <label for="nombre">
                Nombre:
            </label>

            <input
                type="text"
                id="nombre"
                required
            >


            <label for="numero">
                Número:
            </label>

            <input
                type="tel"
                id="numero"
                maxlength="9"
                pattern="[0-9]{9}"
                placeholder="987654321"
                required
            >


            <label for="correo">
                Correo:
            </label>

            <input
                type="email"
                id="correo"
                placeholder="ejemplo@gmail.com"
                required
            >


            <label for="zona">
                Zona de residencia:
            </label>

            <input
                type="text"
                id="zona"
                placeholder="Ej. Mala"
                required
            >


            <button
                type="submit"
                class="boton-crear">
                CREAR CUENTA
            </button>

        </form>


        <button
            class="boton-volver"
            onclick="volverInicio()">
            Volver
        </button>

    </section>


    <script src="script.js"></script>

</body>

</html>
