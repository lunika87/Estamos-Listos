<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>¿ESTAMOS LISTOS?</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- BARRA SUPERIOR -->
    <header>
        <h1>¿ESTAMOS LISTOS?</h1>
    </header>


    <!-- PÁGINA PRINCIPAL -->
    <main id="inicio">

        <img 
            src="LIMA.png" 
            alt="Imagen principal"
            class="imagen-principal"
        >

        <button class="boton-principal" onclick="mostrarRegistro()">
            Solicitar ayuda
        </button>

        <p class="texto-registro">
            ¿Eres voluntario? ¡Registrate!
        </p>

        <button class="boton-registro" onclick="mostrarRegistro()">
            Registrarse
        </button>

    </main>


    <!-- FORMULARIO DE REGISTRO -->
    <section id="registro" class="registro-oculto">

    <h2>Registrarse</h2>

    <form onsubmit="registrarUsuario(event)">

        <label>Nombre:</label>
        <input 
        type="text" 
        id="nombre"
        required
        oninput="this.value = this.value.replace(/[^A-Za-zÁÉÍÓÚáéíóúÑñÜü ]/g, '')"
        title="El nombre solo puede contener letras y espacios"
        >

        <label>Número:</label>

        <div class="telefono">
            <span class="codigo-pais">+51</span>

            <input 
                type="tel" 
                id="numero"
                required
                maxlength="9"
                pattern="[0-9]{9}"
                inputmode="numeric"
                title="Ingresa exactamente 9 números"
                oninput="this.value = this.value.replace(/[^0-9]/g, '')"
            >
        </div>

        <label>Correo:</label>
        <input 
            type="email" 
            id="correo"
            required
        >

        <label>Zona de residencia:</label>
        <input 
            type="text" 
            id="zona"
            required
        >

        <button type="submit" class="boton-crear">
            CREAR CUENTA
        </button>

    </form>

    <button class="boton-volver" onclick="volverInicio()">
        Volver
    </button>

</section>


    <script src="script.js"></script>

</body>
</html>
